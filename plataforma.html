<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plataforma do Fogo em Foco</title>
<meta name="description" content="Mapa interativo do Fogo em Foco: ranque de área queimada e métricas de fogo por estado, município, bioma, unidade de conservação e terra indígena.">
<script>
  // Aplica o tema antes da primeira pintura, senao a pagina pisca em branco
  // antes de escurecer.
  try {
    var t = localStorage.getItem('fef-tema');
    if (t) document.documentElement.dataset.tema = t;
  } catch (e) {}
</script>
<link rel="stylesheet" href="assets/fontes/fontes.css?v=7b741297">
<link rel="stylesheet" href="assets/leaflet.min.css?v=a5aec224">
<link rel="stylesheet" href="assets/identidade.css?v=43343822">
<link rel="stylesheet" href="assets/plataforma.css?v=ca5a03fa">
<link rel="stylesheet" href="assets/downloads.css?v=ca1c1d30">
</head>
<body>
<div class="app">

  <header class="barra">
    <a class="marca" href="index.html"><img src="img/logos/logo_fogoemfoco_horizontal.svg" alt="Fogo em Foco"></a>
    <span class="periodo" id="periodo"></span>
    <button class="baixar" id="abrir-download" type="button" aria-haspopup="dialog" aria-label="Baixar dados">
      <span aria-hidden="true">⤓</span> <span class="rotulo">Baixar dados</span></button>
    <a class="voltar" href="index.html"><span aria-hidden="true">←</span> Início</a>
    <button class="tema" id="tema" type="button" aria-label="Alternar tema claro e escuro" title="Alternar tema">
      <svg class="sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="lua" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <div class="corpo">

    <aside class="controles">
      <div class="bloco">
        <h2>Variável</h2>
        <div class="opcoes" id="variaveis"></div>
      </div>

    </aside>

    <div class="envolve-mapa">
      <div id="mapa"></div>
      <div class="alca esq" data-lado="esq" title="Arraste para alargar ou estreitar a barra"></div>
      <div class="alca dir" data-lado="dir" title="Arraste para alargar ou estreitar o painel"></div>
      <button class="aba esq" type="button" data-lado="esq" aria-label="Recolher a barra de variáveis" title="Recolher a barra"></button>
      <button class="aba dir" type="button" data-lado="dir" aria-label="Recolher o painel de detalhes" title="Recolher o painel"></button>
      <details class="legenda flutua-camadas" id="painel-camadas" open>
        <summary>Recorte territorial</summary>
        <div class="corpo">
          <div class="radios" id="camadas" role="radiogroup" aria-label="Recorte territorial"></div>
          <div id="bloco-filtro" hidden>
            <select class="campo" id="filtro-uf" aria-label="Filtrar por estado"></select>
            <p class="ajuda" id="ajuda-filtro"></p>
          </div>
        </div>
      </details>
      <div class="busca-mapa">
        <input class="campo" id="busca" type="search" placeholder="Buscar pelo nome…"
               aria-label="Buscar pelo nome" autocomplete="off">
        <div class="achados" id="achados"></div>
      </div>
      <details class="legenda" id="legenda" open>
        <summary>Legenda</summary>
        <div class="corpo" id="legenda-corpo"></div>
      </details>
      <div class="carregando" id="carregando" hidden>Carregando…</div>
    </div>

    <aside class="painel" id="painel">
      <div class="vazio">Clique em qualquer área do mapa para ver a série histórica,
      a anomalia climática do ano e as métricas de fogo.</div>
    </aside>

  </div>
</div>

<script src="assets/leaflet.min.js?v=576bf423"></script>
<script src="assets/topojson.min.js?v=9b737e03"></script>
<script src="assets/chart.umd.min.js?v=49aef4c2"></script>
<script src="assets/tema.js?v=6d5e7a29"></script>
<script src="assets/plataforma.js?v=35097dce"></script>
<div class="janela-download" id="janela-download" role="dialog" aria-modal="true" aria-labelledby="titulo-download" hidden>
  <div class="caixa-download">
    <header><b id="titulo-download">Baixar dados e análises</b>
      <button type="button" class="fechar" id="fechar-download" aria-label="Fechar">✕</button></header>
    <div class="abas-download" role="tablist" aria-label="Tipo de download">
      <button type="button" role="tab" id="aba-csv" aria-controls="conteudo-download" data-aba="csv" aria-selected="true">⤓ Dados em tabela (CSV)</button>
      <button type="button" role="tab" id="aba-ficha" aria-controls="conteudo-download" data-aba="ficha" aria-selected="false">⤓ Ficha da área (PDF)</button>
    </div>
    <div class="conteudo-download" id="conteudo-download" role="tabpanel" aria-labelledby="aba-csv"></div>
  </div>
</div>
<script src="assets/downloads-nucleo.js?v=cab1fbdc"></script>
<script src="assets/downloads.js?v=3a438d02"></script>
</body>
</html>
